# Render's free web service sleeps after 15 idle minutes and takes 30-60 s to wake, longer than
# Slack's 3 s: the first click after a quiet spell fails. A ping every 10 minutes keeps it up
# (one service running all month fits Render's 750 free hours). Free on a public repository.
name: Keep the Slack server awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 https://consortium-yqs2.onrender.com/health
