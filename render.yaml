# The hosted Slack app on Render (README, "Hosted"): New → Blueprint → this repo.
# Starter, not Free: a free service sleeps, and Slack gives up on a request after 3 seconds.
# ponytail: no disk; transcripts in /data are lost on redeploy (settings, keys and installs are in
# Postgres). Add a disk at /data when meeting history on the server matters.
services:
  - type: web
    name: consortium
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: consortium-db
          property: connectionString
      - key: CONSORTIUM_SECRET
        generateValue: true
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false

databases:
  - name: consortium-db
    plan: basic-256mb
