# The hosted Slack app on Render (README, "Hosted"): New → Blueprint → this repo.
# Starter, not Free: a free service sleeps, and Slack gives up on a request after 3 seconds.
# The database is outside Render: set DATABASE_URL to a Postgres connection string (a free Neon
# database is enough). Transcripts in /data are lost on redeploy; settings, keys and installs aren't.
services:
  - type: web
    name: consortium
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CONSORTIUM_SECRET
        generateValue: true
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
