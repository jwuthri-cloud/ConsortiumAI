# The hosted Slack app on Render (README, "Hosted"): New → Blueprint → this repo.
# Starter, not Free: a free service sleeps, and Slack gives up on a request after 3 seconds.
# One SQLite file on a 1 GB disk instead of a Render Postgres ($0.25/month, daily snapshots).
# ponytail: a disk means one instance and a few seconds' downtime per deploy; move DATABASE_URL to
# a Postgres when one instance stops being enough.
services:
  - type: web
    name: consortium
    runtime: docker
    plan: starter
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:/data/consortium.db
      - key: CONSORTIUM_SECRET
        generateValue: true
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
