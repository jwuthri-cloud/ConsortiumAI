# Create the app from this at https://api.slack.com/apps → Create New App → From a manifest.
display_information:
  name: Consortium
  description: A table of AI members that debates your question in a thread and writes the decision.
features:
  bot_user:
    display_name: Consortium
    always_online: false
  slash_commands:
    - command: /consortium
      description: Convene the table on a question
      usage_hint: '[preset:] <question>'
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - chat:write.customize
      - commands
      - channels:history
      - groups:history
      - files:write
      - canvases:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
